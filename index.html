<!DOCTYPE html>
<html lang="en">
<head>
    <title>Timeline of COVID-19 in Canada: Dashboard</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="./favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header class="navbar navbar-light bg-white border-bottom mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <img src="favicon.png" alt="" width="30" height="30">
                <span>Timeline of COVID-19 in Canada</span>
            </a>
        </div>
    </header>

    <main class="container pb-4">
        <div class="alert alert-secondary archive-notice" role="note">
            This historical dataset ends on December 31, 2023. Different metrics and jurisdictions may end earlier.
        </div>

        <section class="card bg-light mb-3" aria-labelledby="controls-heading">
            <div class="card-body">
                <h1 id="controls-heading" class="h5 mb-3">Chart options</h1>
                <div class="row g-3">
                    <div class="col-md-5">
                        <label class="form-label" for="metric">Metric</label>
                        <select id="metric" class="form-select"></select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="value-mode">Value</label>
                        <select id="value-mode" class="form-select"></select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="cadence">Time interval</label>
                        <select id="cadence" class="form-select">
                            <option value="daily">Daily</option>
                            <option value="weekly">Weekly</option>
                        </select>
                    </div>
                </div>

                <fieldset class="mt-4">
                    <legend class="h6">Add a geography</legend>
                    <div class="row g-2 align-items-end">
                        <div class="col-md-3">
                            <label class="form-label" for="geography-level">Level</label>
                            <select id="geography-level" class="form-select"></select>
                        </div>
                        <div class="col-md-7">
                            <label class="form-label" for="geography">Region</label>
                            <select id="geography" class="form-select"></select>
                        </div>
                        <div class="col-md-2 d-grid">
                            <button id="add-geography" class="btn btn-primary" type="button">Add</button>
                        </div>
                    </div>
                </fieldset>

                <div class="mt-3">
                    <div class="form-label mb-2">Selected geographies</div>
                    <div id="selected-geographies" class="selected-geographies"></div>
                </div>
                <div id="selection-message" class="form-text mt-2" role="status" aria-live="polite"></div>
            </div>
        </section>

        <section class="card mb-3" aria-labelledby="chart-heading">
            <div class="card-body">
                <h2 id="chart-heading" class="visually-hidden">Timeline chart</h2>
                <div id="chart-message" class="alert d-none" role="alert"></div>
                <div id="chart" class="chart" role="img" aria-label="COVID-19 timeline chart"></div>
            </div>
        </section>

        <section id="reporting-card" class="card mb-3" aria-labelledby="reporting-heading">
            <div class="card-body">
                <h2 id="reporting-heading" class="h5">Reporting status</h2>
                <div id="reporting-status"></div>
            </div>
        </section>

        <details class="card" id="data-notes">
            <summary class="card-header">About this data and sources</summary>
            <div class="card-body notes-body">
                <div id="metric-definition"></div>
                <div id="general-notes"></div>
                <div id="jurisdiction-notes"></div>
            </div>
        </details>
    </main>

    <script type="module" src="main.js"></script>
</body>
</html>
